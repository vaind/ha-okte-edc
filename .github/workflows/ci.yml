name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv  # Python version from .python-version
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true

      # Required: setup-uv does not create a venv (its implicit venv behavior
      # is unstable across majors). Later steps invoke .venv/bin/* directly —
      # do not drop this step.
      - name: Create virtualenv
        run: uv venv .venv

      - name: Install dev dependencies
        run: uv pip install --group dev

      - name: pytest (offline)
        run: .venv/bin/python -m pytest tests/
